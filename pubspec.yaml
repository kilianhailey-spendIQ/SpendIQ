name: spendiq
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0
dependencies:
  flutter_dropzone: ^4.0.0
  google_mlkit_text_recognition: 0.15.1
  pdf_render: ^1.0.0
  spreadsheet_decoder: ^2.0.0
  supabase_flutter: '>=1.10.0'
  http: ^1.0.0
  url_launcher: ^6.0.0
  js: 0.7.2
  excel: ^4.0.6
  syncfusion_flutter_pdf: ^31.0.0
  file_picker: '>=8.1.2'
  shared_preferences: ^2.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  go_router: ^16.2.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/documents/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
